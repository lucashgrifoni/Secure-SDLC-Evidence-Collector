# Opt-in partial release evidence for selected actual FedRAMP CR26 KSIs.
# This is a supporting evidence catalog, not a KSI compliance verdict.
controls:
- control_id: KSI-SCR-MIT
  framework: ORG_INTERNAL
  name: Supporting evidence for supply chain risk review
  description: 'Partial, project-defined release evidence mapping to FedRAMP CR26 KSI-SCR-MIT. Presence
    of these records cannot establish persistent measures, automation, cryptographic verification,
    independent assessment, or authorization. Review relevance, scope, frequency, and effectiveness
    separately. Source: FedRAMP/rules 2026.10.05.01, commit 1c33385a06acf4faf50da2b9b4dc31cd826e5b91.'
  criticality: high
  required_evidence_types:
  - sbom
  - sca_scan
  recommended_evidence_types:
  - artifact_attestation
