# Secure SDLC for AI / LLM systems — OPT-IN catalog.
#
# Status: preview. Mappings are partial supporting evidence, not conformance.
# SP 800-218A applies to AI model development; deployment and operation of AI
# systems are outside its scope. Maps to NIST SP 800-218A "SSDF Community Profile
# for Generative AI" (published 2024-07) practices, the OWASP Top 10
# for LLM Applications (2025), and the OWASP Top 10 for Agentic
# Applications (2026). The default ``catalog.yaml`` still encodes
# generic NIST SSDF 1.1 because most projects do not ship AI
# artifacts; pipelines that DO ship AI artifacts opt in via:
#
#     sdlc-evidence run --catalog <path-to-this-file>
#
# Or programmatically:
#
#     from evidence_collector.controls.catalog import bundled_catalog_path
#     path = bundled_catalog_path("catalog-ai.yaml")
#
# OWASP LLM references use the 2025 numbering
# (https://genai.owasp.org/llm-top-10/): LLM01 Prompt Injection,
# LLM02 Sensitive Information Disclosure, LLM03 Supply Chain,
# LLM04 Data and Model Poisoning, LLM05 Improper Output Handling,
# LLM06 Excessive Agency, LLM07 System Prompt Leakage, LLM08 Vector
# and Embedding Weaknesses, LLM09 Misinformation, LLM10 Unbounded
# Consumption.
#
# Evidence types referenced
# -------------------------
# * ``model_card`` — Hugging Face / Google Model Card JSON for the
#   shipped model. Anchors model provenance, intended use, and
#   evaluation metrics.
# * ``prompt_injection_test_result`` — output of garak or equivalent
#   prompt-injection test harness.
# * ``ai_safety_eval`` — output of lm-eval-harness (or equivalent)
#   covering safety / bias / refusal metrics.
# * ``mcp_tool_inventory`` — declarative inventory of the MCP /
#   tool-use surface the agent can reach. Required for Agentic
#   systems (OWASP Top 10 for Agentic Applications 2026: tool misuse
#   / excessive tool reach).
# * ``ai_training_data_lineage`` — manifest describing the datasets
#   used to train / fine-tune the model, with their provenance and
#   licensing.
# * ``threat_model`` — Secure-SDLC threat model with an explicit
#   AI section (LLM01:2025 prompt injection, LLM02:2025 sensitive
#   disclosure, Agentic top risks).
#
# Framework mapping is captured in the ``description`` of each
# control. ADR-0008 carries the full crosswalk.
controls:
  - control_id: "AI-MODEL-CARD"
    framework: "NIST_SSDF"
    name: "Model card present and machine-readable"
    description: >-
      Maps to SP 800-218A PO.1.2 N1 (model documentation) and
      OWASP LLM02:2025 (sensitive information disclosure). The shipped
      model must carry a machine-readable model card with intended
      use, evaluation metrics, and known limitations.
      NIST CSF 2.0 informative references for SSDF 1.1 PO.1: GV.OC-03, GV.SC-05. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["model_card"]
    recommended_evidence_types: []

  - control_id: "AI-PROMPT-INJ"
    framework: "NIST_SSDF"
    name: "Prompt-injection test coverage"
    description: >-
      Maps to SP 800-218A PW.8.2 (AI model vulnerability testing) and OWASP LLM01:2025 (prompt
      injection). The release must carry test results from a
      prompt-injection harness (garak or equivalent) executed
      against the shipped model + system prompt.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.8: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["prompt_injection_test_result"]
    recommended_evidence_types: ["threat_model"]

  - control_id: "AI-SAFETY-EVAL"
    framework: "NIST_SSDF"
    name: "Safety / bias / refusal evaluation"
    description: >-
      Project policy includes safety and bias metrics. SP 800-218A PW.8.2 supports the
      model vulnerability testing portion only. The release must carry safety
      and bias evaluation results from lm-eval-harness (or
      equivalent) on the shipped model.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.8: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["ai_safety_eval"]
    recommended_evidence_types: []

  - control_id: "AI-TRAINING-LINEAGE"
    framework: "NIST_SSDF"
    name: "Training data lineage manifest"
    description: >-
      Maps to SP 800-218A PW.3.2 (training, testing, fine-tuning and aligning data provenance) and OWASP LLM04:2025 (data and model poisoning). The
      release must carry a manifest describing training datasets, with
      provenance and licensing.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.3: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "medium"
    required_evidence_types: ["ai_training_data_lineage"]
    recommended_evidence_types: []

  - control_id: "AI-MCP-INVENTORY"
    framework: "ORG_INTERNAL"
    name: "MCP / agent tool inventory"
    description: >-
      Maps to the OWASP Top 10 for Agentic Applications (2026)
      (excessive tool reach / tool misuse), OWASP LLM06:2025
      (excessive agency). This is project policy for deployed agents, outside
      SP 800-218A model-development scope. Agentic
      systems must declare the full MCP / tool surface (allow-list of
      tools, scopes, network reach) so reviewers can bound blast
      radius.
    criticality: "high"
    required_evidence_types: ["mcp_tool_inventory"]
    recommended_evidence_types: []

  - control_id: "AI-THREAT-MODEL"
    framework: "NIST_SSDF"
    name: "AI-aware threat model"
    description: >-
      Maps to SP 800-218A PW.1.1 (AI model risk assessment). The threat model must cover
      LLM-specific risks (prompt injection, output handling, supply
      chain of model weights, agentic blast radius) in addition to
      the generic Secure SDLC threats.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.1: ID.RA-05. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "medium"
    required_evidence_types: ["threat_model"]
    recommended_evidence_types: ["mcp_tool_inventory"]

  - control_id: "AI-SBOM"
    framework: "NIST_SSDF"
    name: "SBOM of AI runtime stack"
    description: >-
      Maps to SSDF PS.3. AI systems still ship code; the SBOM must
      cover both the runtime (inference engine, retrieval stack,
      tool-use libraries) and any pinned model weights described as
      components. Defended against OWASP LLM03:2025 (supply chain).
      NIST CSF 2.0 informative references for SSDF 1.1 PS.3: PR.DS-01, PR.DS-11. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "critical"
    required_evidence_types: ["sbom"]
    recommended_evidence_types: ["artifact_attestation"]

  - control_id: "AI-SCA"
    framework: "NIST_SSDF"
    name: "SCA over AI runtime dependencies"
    description: >-
      Maps to SSDF PW.4 + OWASP LLM03:2025 (supply chain). Dependency
      scanning must cover AI runtime packages (transformers,
      langchain, etc.) whose CVE surface changes faster than typical
      app stacks.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.4: GV.SC-03, GV.SC-07, ID.AM-08. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["sca_scan"]
    recommended_evidence_types: []

  - control_id: "AI-SAST"
    framework: "NIST_SSDF"
    name: "SAST over agent / orchestration code"
    description: >-
      Maps to SSDF PW.7 + OWASP LLM05:2025 (improper output handling)
      + OWASP Top 10 for Agentic Applications (2026). SAST must cover
      the code that wires the model into prompts, tools, and user
      inputs — most improper-output-handling bugs live in this
      orchestration layer, not in the model itself.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.7: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["sast_scan"]
    recommended_evidence_types: []

  - control_id: "AI-RELEASE-APPROVAL"
    framework: "ORG_INTERNAL"
    name: "Formal release approval for AI release"
    description: >-
      Generic SSDF release-approval gate scoped to AI. Approver must
      acknowledge the AI-specific risk surface (OWASP Top 10 for LLM
      Applications 2025 + OWASP Top 10 for Agentic Applications 2026)
      before promotion to production.
    criticality: "critical"
    required_evidence_types: ["release_approval"]
    recommended_evidence_types: []
