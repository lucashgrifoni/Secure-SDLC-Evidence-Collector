# NIST SSDF 1.2 (SP 800-218 Rev. 1) catalog — OPT-IN, preview.
#
# Status: preview, based on the initial public draft of NIST SP 800-218r1
# (SSDF version 1.2), published 2025-12-17. Its comment period closed on
# 2026-01-30 and no final version had been issued as of 2026-10-16
# (https://csrc.nist.gov/pubs/sp/800/218/r1/ipd). Default ``catalog.yaml``
# still encodes SSDF 1.1. Pipelines that want to evaluate against the 1.2
# draft select this catalog via:
#
#     sdlc-evidence run --catalog <path-to-this-file>
#
# Or programmatically:
#
#     from importlib.resources import files
#     path = files("evidence_collector.controls.data") / "catalog-ssdf-1.2.yaml"
#     sdlc-evidence run --catalog "$path"
#
# What the draft changes (its Appendix B change log): it adds two
# practices, PO.6 (continuous process improvement) and PS.4 (robust and
# reliable updates), rewords tasks RV.1.2 and RV.3.3, and edits examples
# and references. It does not change the PS.3 or PW.6 practices or tasks.
#
# Diff vs default 1.1 catalog
# --------------------------
# * ``SSDF-PS.3`` — project policy, stricter than SSDF: promotes
#   ``artifact_attestation`` from ``recommended_evidence_types`` to
#   ``required_evidence_types``, so an SBOM alone does not meet PS.3 here.
#   NIST does not require this; the 1.2 draft leaves PS.3 as in 1.1.
# * ``SSDF-PW.6`` — added. PW.6 "Configure the Compilation, Interpreter,
#   and Build Processes to Improve Executable Security" is an SSDF 1.1
#   practice, unchanged in the draft, that the default catalog does not
#   evaluate. Required evidence: ``artifact_attestation`` (build-process
#   attestation). Recommended: ``test_result`` (build-hardening tests).
# * ``SSDF-PS.4`` and ``SSDF-PO.6`` — added from the draft with
#   recommended evidence only. A missing recommended type makes a control
#   partial with a low-criticality gap: a ``ready`` verdict becomes
#   ``conditional``, never ``not_ready``.
#
# Every other control is copied verbatim from the 1.1 catalog so a
# pipeline switching from 1.1 to 1.2 sees only additive expectations.
controls:
  - control_id: "SSDF-PW.7"
    framework: "NIST_SSDF"
    name: "Review and/or analyze human-readable code (SAST)"
    description: >-
      Static analysis evidence must be produced against the release commit to
      identify implementation-level vulnerabilities before deployment.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.7: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["sast_scan"]
    recommended_evidence_types: []

  - control_id: "SSDF-PW.4"
    framework: "NIST_SSDF"
    name: "Reuse existing, well-secured software (SCA)"
    description: >-
      Third-party and open source dependencies must be scanned for known
      vulnerabilities before release.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.4: GV.SC-03, GV.SC-07, ID.AM-08. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["sca_scan"]
    recommended_evidence_types: []

  - control_id: "ORG-SECRETS-SCAN"
    framework: "ORG_INTERNAL"
    name: "Repository-wide secrets scanning"
    description: >-
      The release commit must be scanned for accidentally committed secrets
      and credentials.
    criticality: "high"
    required_evidence_types: ["secrets_scan"]
    recommended_evidence_types: []

  # Project policy: artifact_attestation is required here, not by NIST.
  - control_id: "SSDF-PS.3"
    framework: "NIST_SSDF"
    name: "Archive and protect each software release (SBOM + attestation)"
    description: >-
      Project policy, stricter than SSDF: the release must carry both a
      Software Bill of Materials and a verifiable build attestation (SLSA /
      in-toto / Sigstore), so an SBOM alone does not meet this control. The
      SSDF 1.2 initial public draft leaves PS.3 as in SSDF 1.1; the
      attestation requirement is this catalog's choice, not NIST's.
      NIST CSF 2.0 informative references for SSDF 1.1 PS.3: PR.DS-01, PR.DS-11. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "critical"
    required_evidence_types: ["sbom", "artifact_attestation"]
    recommended_evidence_types: ["artifact_signature"]

  - control_id: "SSDF-PW.8"
    framework: "NIST_SSDF"
    name: "Test executable code to identify vulnerabilities"
    description: >-
      Automated tests (unit or higher) must be executed against the release
      commit with their results archived.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.8: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["test_result"]
    recommended_evidence_types: []

  - control_id: "ORG-CODE-REVIEW"
    framework: "ORG_INTERNAL"
    name: "Code review by eligible reviewers"
    description: >-
      Every change reaching the release branch must be peer-reviewed by at
      least one eligible reviewer with approval after the last commit.
    criticality: "critical"
    required_evidence_types: ["code_review"]
    recommended_evidence_types: ["pr_metadata"]

  - control_id: "SSDF-PW.1"
    framework: "NIST_SSDF"
    name: "Design software to meet security requirements (threat model)"
    description: >-
      A threat model (or a justified non-applicability attestation) must exist
      for the feature scope covered by this release.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.1: ID.RA-05. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "medium"
    required_evidence_types: ["threat_model"]
    recommended_evidence_types: []

  # Not in the default 1.1 catalog, although PW.6 is an SSDF 1.1 practice.
  - control_id: "SSDF-PW.6"
    framework: "NIST_SSDF"
    name: "Configure compilation, interpreter, and build processes for security"
    description: >-
      SSDF PW.6: the build process itself must be configured to improve
      executable security (hardened compiler flags, reproducible builds,
      controlled toolchain). PW.6 is an SSDF 1.1 practice, unchanged in the
      1.2 initial public draft, that the default catalog does not evaluate.
      The release must carry an attestation of the build process and ideally
      test evidence that the hardening is in place.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.6: none listed. See ADR-0014; references support traceability, not compliance.
    criticality: "high"
    required_evidence_types: ["artifact_attestation"]
    recommended_evidence_types: ["test_result"]

  # From the SSDF 1.2 initial public draft; recommended evidence only.
  - control_id: "SSDF-PS.4"
    framework: "NIST_SSDF"
    name: "Ensure software updates are robust and reliable (SSDF 1.2 draft)"
    description: >-
      SSDF 1.2 initial public draft PS.4, "Ensure Software Updates Are Robust
      and Reliable". Recorded test results support PS.4.1 (thoroughly test
      all releases) and a rollback plan supports PS.4.3 (include robust
      rollback mechanisms for updates). Both are recommended evidence, so a
      gap never blocks a release. PS.4.2 (tiered update and release
      strategies) and PS.4.4 (update engines and delivery infrastructure)
      need manual review. The draft lists no NIST CSF 2.0 reference for PS.4.
      Draft content: it changes if the final SSDF 1.2 changes it.
    criticality: "low"
    required_evidence_types: []
    recommended_evidence_types: ["test_result", "rollback_plan"]

  # From the SSDF 1.2 initial public draft; recommended evidence only.
  - control_id: "SSDF-PO.6"
    framework: "NIST_SSDF"
    name: "Define and implement a continuous process improvement plan (SSDF 1.2 draft)"
    description: >-
      SSDF 1.2 initial public draft PO.6, "Define and Implement a Continuous
      Process Improvement Plan": PO.6.1 update development environments for
      new threats and tools, PO.6.2 identify new processes, tools and
      techniques that avoid software errors, PO.6.3 improve vulnerability
      response and review prior decisions. Release evidence cannot show an
      improvement process, so a reviewer-supplied generic attestation is the
      recommended record and a gap never blocks a release. The draft cites
      NIST CSF 2.0 ID.IM (category level) for PO.6.1 to PO.6.3; see ADR-0014.
      Draft content: it changes if the final SSDF 1.2 changes it.
    criticality: "low"
    required_evidence_types: []
    recommended_evidence_types: ["generic_attestation"]

  - control_id: "ORG-RELEASE-APPROVAL"
    framework: "ORG_INTERNAL"
    name: "Formal release approval"
    description: >-
      The release must have a documented approval by an authorized approver
      before promotion to production.
    criticality: "critical"
    required_evidence_types: ["release_approval"]
    recommended_evidence_types: []

  - control_id: "ORG-REL-ROLLBACK"
    framework: "ORG_INTERNAL"
    name: "Rollback plan exists and was approved"
    description: >-
      A rollback plan must accompany the release so operations can recover
      quickly from a failed deployment.
    criticality: "critical"
    required_evidence_types: ["rollback_plan"]
    recommended_evidence_types: []

  - control_id: "SSDF-PS.2"
    framework: "NIST_SSDF"
    name: "Provide a mechanism to verify software release integrity"
    description: >-
      The published artifact must carry a signature, attestation, or
      equivalent integrity proof.
      NIST CSF 2.0 informative references for SSDF 1.1 PS.2: PR.DS-01. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "critical"
    required_evidence_types: ["artifact_signature"]
    recommended_evidence_types: ["artifact_attestation"]

  - control_id: "SAMM-DESIGN-TA-1"
    framework: "OWASP_SAMM"
    name: "Threat Assessment (Design / Threat Assessment 1)"
    description: >-
      OWASP SAMM secondary mapping: threat modeling activity performed for
      the release scope. Complements SSDF-PW.1 with a practice-based view.
      NIST CSF 2.0 informative references for SSDF 1.1 PW.1: ID.RA-05. Snapshot 2026-09-24, SHA-256 7a34c3ab5e500b380327bb2f9cc8a8ca46fe2bc058ad30d963efc793950995b0. See ADR-0014; references support traceability, not compliance.
    criticality: "medium"
    required_evidence_types: ["threat_model"]
    recommended_evidence_types: []

  - control_id: "SAMM-IMPL-SB-2"
    framework: "OWASP_SAMM"
    name: "Secure Build (Implementation / Secure Build 2)"
    description: >-
      OWASP SAMM mapping: build integrity evidence (SBOM + signature or
      attestation) must be produced to support verifiable delivery.
    criticality: "high"
    required_evidence_types: ["sbom"]
    recommended_evidence_types: ["artifact_signature", "artifact_attestation"]

  - control_id: "SAMM-VERIF-ST-1"
    framework: "OWASP_SAMM"
    name: "Security Testing (Verification / Security Testing 1)"
    description: >-
      OWASP SAMM mapping: automated security testing evidence (SAST + SCA)
      must cover the release commit.
    criticality: "high"
    required_evidence_types: ["sast_scan"]
    recommended_evidence_types: ["sca_scan", "dast_scan"]
