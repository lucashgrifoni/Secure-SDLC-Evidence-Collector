# mkdocs configuration for the technical documentation site.
#
# The site is published as a sub-path (`/docs/`) of the GitHub Pages
# deploy in `.github/workflows/deploy-github-pages.yml`. The root of
# the Pages site hosts the gitpage/ landing page, and `/evidence/` hosts
# the evidence summary the CLI generates from the sample release, so the
# project dogfoods its own output.
#
# Local preview:
#   pip install mkdocs-material
#   mkdocs serve

site_name: Secure SDLC Evidence Collector
site_description: >-
  Technical documentation for the Secure SDLC Evidence Collector — a
  CLI-first AppSec/DevSecOps tool that produces auditable release
  evidence bundles.
site_author: Lucas Henrique Grifoni
site_url: https://lucashgrifoni.github.io/Secure-SDLC-Evidence-Collector/docs/

repo_name: lucashgrifoni/Secure-SDLC-Evidence-Collector
repo_url: https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site-docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Bundle schema reference: bundle_schema.md
  - JSON logs events: json-logs.md
  - Upgrading: upgrading.md
  - Evidence profile migration: evidence-profile-migration.md
  - GitHub Action: github_action.md
  - Reusable workflow: reusable_workflow.md
  - Release readiness: release-readiness.md
  - Rolling back a release: rollback.md
  - AI evidence: ai-evidence.md
  - Comparison vs alternatives: comparison.md
  - GUAC integration: guac.md
  - Control gaps as SARIF: sarif.md
  - Plugins: plugins.md
  - Policy snippets: policies.md
  - Limitations: limitations.md
  - Traceability: traceability.md
  - Maturity:
      - Roadmap: MATURITY_ROADMAP.md
      - OSPS Baseline self-assessment: osps-baseline-self-assessment.md
  - Repository wiki: openwiki.md
  - Architecture decisions:
      - Index: adr/README.md
      - ADR-0001 Pydantic v2: adr/0001-pydantic-v2.md
      - ADR-0002 Deterministic JSON: adr/0002-deterministic-json.md
      - ADR-0003 Typer CLI: adr/0003-typer-cli.md
      - ADR-0004 Evidence-first: adr/0004-evidence-first.md
      - ADR-0005 Catalog override: adr/0005-control-catalog-override.md
      - ADR-0006 CLI command modularization: adr/0006-cli-command-modularization.md
      - ADR-0007 in-toto predicate type variants: adr/0007-intoto-predicate-type-variants.md
      - ADR-0008 AI evidence types and provenance: adr/0008-ai-evidence-types-and-provenance.md
      - ADR-0009 Risk-weighted release verdict: adr/0009-risk-weighted-release-verdict.md
      - ADR-0010 Reachability as optional SCA evidence field: adr/0010-reachability-as-optional-sca-evidence-field.md
      - ADR-0011 CRA + FedRAMP 20x profiles: adr/0011-cra-and-fedramp-20x-profiles.md
      - ADR-0012 GUAC graph integration: adr/0012-guac-graph-integration.md
      - ADR-0013 Release versioning process: adr/0013-release-versioning-process.md
      - ADR-0014 CSF 2.0 crosswalk: adr/0014-csf-2-crosswalk-for-built-in-catalogs.md
      - ADR-0015 Source-backed evidence profiles: adr/0015-source-backed-evidence-profiles.md

# docs/program/ (program and runbook notes kept in the repository) and
# output/ are left out of the build entirely: nothing under them is
# published on the Pages site. The ``exclude_docs`` block keeps mkdocs
# --strict happy by making it clear we own the omission.
exclude_docs: |
  program/
  output/

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector
