# Secure SDLC Evidence Collector — GitLab CI / CD template.
#
# DEPRECATED. Use the GitLab CI/CD Catalog component instead:
#
#   include:
#     - component: gitlab.com/lucas.henriquegrifoni/secure-sdlc-evidence-component/collect@<version>
#
# Its source and documentation are in examples/gitlab-component. This
# template only receives version bumps. Known problems that the component
# does not have: values with spaces (an application name, a directory) are
# split into separate arguments and the run fails with a usage error; an
# empty RELEASE_ID (the example below on a branch pipeline) makes the next
# option its value; tag pipelines record the tag as the branch; and an empty
# COLLECTOR_VERSION installs the latest release.
#
# Include this file in your `.gitlab-ci.yml` to add an `evidence`
# stage that runs the collector against scanner output sitting in
# `$ARTIFACTS_DIR`:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/lucashgrifoni/Secure-SDLC-Evidence-Collector/v4.2.0/examples/gitlab-ci/secure-sdlc-evidence.yml' # x-release-please-version
#
#   evidence:
#     stage: release
#     extends: .secure-sdlc-evidence
#     variables:
#       APPLICATION: my-app
#       REPOSITORY: my-org/my-app
#       RELEASE_ID: $CI_COMMIT_TAG
#       ARTIFACTS_DIR: scanner-output
#
# The job uploads `release-evidence/` as a GitLab artifact so
# downstream jobs (signing, OSCAL export, etc.) can pick it up.
.secure-sdlc-evidence:
  image: python:3.12-slim
  variables:
    PYTHONUNBUFFERED: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    APPLICATION: ""
    REPOSITORY: ""
    RELEASE_ID: ""
    COMMIT_SHA: $CI_COMMIT_SHA
    BRANCH: $CI_COMMIT_REF_NAME
    ARTIFACTS_DIR: artifacts
    ATTESTATIONS_DIR: ""
    EXCEPTIONS_DIR: ""
    CATALOG: ""            # e.g. catalog-ai.yaml | catalog-ssdf-1.2.yaml | catalog-fedramp-cr26.yaml | catalog-osps-baseline.yaml
    RISK_MODE: "off"       # 'off' | 'epss-weighted'
    PROFILE: "none"        # 'none' | 'cra-2026' | 'fedramp-20x'
    CRA_CONTEXT: ""        # CRA operator context JSON; needs PROFILE cra-2026
    FEDRAMP_CLASS: ""      # A | B | C | D, metadata only; needs PROFILE fedramp-20x
    COLLECTOR_VERSION: ""  # leave empty for latest; pin in production
    FAIL_ON: not_ready
  before_script:
    - python -m pip install --upgrade pip
    - if [ -n "$COLLECTOR_VERSION" ]; then
        python -m pip install "secure-sdlc-evidence-collector==$COLLECTOR_VERSION";
      else
        python -m pip install "secure-sdlc-evidence-collector";
      fi
  script:
    - >-
      set -euo pipefail;
      args="--application $APPLICATION
            --repository $REPOSITORY
            --release-id $RELEASE_ID
            --commit-sha $COMMIT_SHA
            --branch $BRANCH
            --output-dir release-evidence
            --artifacts-dir $ARTIFACTS_DIR
            --risk-mode $RISK_MODE
            --profile $PROFILE
            --fail-on $FAIL_ON";
      if [ -n "$ATTESTATIONS_DIR" ]; then
        args="$args --attestations-dir $ATTESTATIONS_DIR";
      fi;
      if [ -n "$EXCEPTIONS_DIR" ]; then
        args="$args --exceptions-dir $EXCEPTIONS_DIR";
      fi;
      if [ -n "$CATALOG" ]; then
        args="$args --catalog $CATALOG";
      fi;
      if [ -n "$CRA_CONTEXT" ]; then
        args="$args --cra-context $CRA_CONTEXT";
      fi;
      if [ -n "$FEDRAMP_CLASS" ]; then
        args="$args --fedramp-class $FEDRAMP_CLASS";
      fi;
      sdlc-evidence run $args
  artifacts:
    when: always
    paths:
      - release-evidence/
    expire_in: 1 year
