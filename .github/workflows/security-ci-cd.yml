# Security CI/CD
#
# Standard security pipeline covering:
#   - SAST          : Semgrep, Snyk Code (native CodeQL runs in codeql.yml)
#   - SCA           : Snyk Open Source, Trivy (filesystem vuln), Dependency Review (PR)
#   - IaC / Pipeline: Trivy (misconfig)
#   - Secrets       : Trivy (secret), Gitleaks (git history)
#   - Workflow lint : actionlint
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Harden-Runner egress:
#   - Start with `egress-policy: audit` for 2-4 weeks per repository.
#   - Review the Harden-Runner insights/recommended policy for each job.
#   - Then switch to `egress-policy: block` and add the observed
#     job-specific `allowed-endpoints` allowlist.
#   - Block-mode syntax:
#       egress-policy: block
#       allowed-endpoints: |
#         <observed-host>:443
#
# Semgrep severity mapping:
#   - WARNING = medium-severity findings
#   - ERROR   = high-severity findings
#
# Required repository or organization secrets:
#   - SNYK_TOKEN          : Snyk Code and Snyk Open Source scans
#   - GITLEAKS_LICENSE    : required only for organizations using the paid
#                           gitleaks-action license
#
# GITHUB_TOKEN is supplied automatically by GitHub Actions.
# SARIF uploads require `security-events: write`. The workflow-level token is
# read-only; each job grants its own write scope (least privilege). On private
# repositories, SARIF upload and Dependency Review require GitHub Advanced
# Security; on public repositories both are free.

name: Security CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  merge_group:

# Least-privilege: top-level is read-only (OpenSSF Token-Permissions). Each
# job below elevates only what it needs (security-events: write for SARIF
# uploads, pull-requests: write for the dependency-review PR comment).
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
  TRIVY_SKIP_DIRS: ".git,node_modules,dist,build,coverage"
  SNYK_SEVERITY_THRESHOLD: "medium"

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: python -m pip install --upgrade "semgrep>=1.100.0,<2"

      - name: Scan application and workflow code
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/github-actions \
            --severity WARNING \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-snyk-code:
    name: SAST - Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Dependabot (and fork) PRs do not receive the SNYK_TOKEN secret, so the
    # Snyk jobs would always fail there. Skip Snyk for the dependabot actor;
    # Semgrep, CodeQL, and Trivy still cover those PRs.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No `snyk auth` step: the Snyk CLI reads SNYK_TOKEN from the
      # environment, which every scan step below already sets. The separate
      # auth step was redundant and was the only place an invalid token could
      # fail — with a bare `exit 2` and no explanation. Without it, a bad token
      # surfaces in the scan itself, with the scanner's own message.
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk code test
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  sca-snyk:
    name: SCA - Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # See sast-snyk-code: skip for dependabot, which lacks the SNYK_TOKEN secret.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Snyk's pip plugin needs a requirements-style manifest. This project
      # ships PEP 621 metadata in pyproject.toml with no requirements.txt, which
      # `snyk test --all-projects` cannot detect (SNYK-CLI-0008). Resolve the
      # full runtime dependency tree into a pinned manifest and scan that.
      # `--exclude-editable` drops the editable self-package line so Snyk only
      # sees real third-party dependencies and their transitive closure.
      - name: Resolve Python dependency manifest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip freeze --exclude-editable > requirements-snyk.txt
          echo "Resolved dependencies:"
          cat requirements-snyk.txt

      # No `snyk auth` step: the Snyk CLI reads SNYK_TOKEN from the
      # environment, which every scan step below already sets. The separate
      # auth step was redundant and was the only place an invalid token could
      # fail — with a bare `exit 2` and no explanation. Without it, a bad token
      # surfaces in the scan itself, with the scanner's own message.
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --file=requirements-snyk.txt
          --package-manager=pip
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-oss.sarif

      - name: Upload Snyk Open Source SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-deps.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  iac-and-pipeline-trivy:
    name: IaC and Pipeline - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan IaC and workflow misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  secrets-trivy:
    name: Secrets - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read  # read workflow run status for SARIF upload (required on private repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan repository files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy secrets SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  secrets-history-gitleaks:
    name: Secrets History - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action reads PR commits on pull_request events
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Review new dependencies introduced by the pull request
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  workflow-lint:
    name: Workflow Lint - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # pinned
