name: GitHub CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy strict type-check
        run: python -m mypy src tests

      - name: Pytest with coverage gate
        run: python -m pytest --cov=evidence_collector --cov-report=xml --cov-report=term-missing

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Build package artifacts
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  sample-bundle:
    name: Produce sample evidence bundle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate sample bundle
        run: |
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id 2026.04.10 \
            --commit-sha abcdef1234567890 \
            --branch main \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir examples/sample_release/attestations \
            --output-dir output/sample_release \
            --fail-on not_ready

      - name: Export bundle JSON Schema
        run: |
          python -m evidence_collector.cli.main schema \
            --output output/sample_release/bundle.schema.json

      - name: Validate bundle against exported schema
        run: |
          python -m pip install --quiet "jsonschema>=4.20,<5"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          bundle = json.loads(Path("output/sample_release/bundle.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("output/sample_release/bundle.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(bundle), key=lambda e: e.path)
          if errors:
              for err in errors:
                  print(f"  - {list(err.path)}: {err.message}", file=sys.stderr)
              sys.exit(1)
          print("Bundle conforms to its exported JSON Schema.")
          PY

      - name: Upload sample bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sample-release-bundle
          path: output/sample_release/
          if-no-files-found: error
