# GitHub CI/CD — quality, packaging, and determinism gates (Python).
#
# Jobs:
#   - quality            : ruff lint + format, mypy --strict, pytest + coverage
#                          across the Python 3.12 / 3.13 matrix.
#   - package            : build wheel + sdist.
#   - sample-bundle      : generate a sample evidence bundle, validate it against
#                          its exported JSON Schema, and enforce a structural
#                          determinism gate (re-run, normalize, compare SHA-256).
#   - sample-bundle-windows / cross-os-determinism : prove the bundle is
#                          byte-stable across Linux and Windows.
#
# Triggers: pull_request + push (main/master/develop), merge_group, manual.
#
# Supply-chain hardening:
#   - All actions are pinned to immutable commit SHAs (trailing comment = tag).
#   - Keep .github/dependabot.yml enabled for github-actions to refresh pins.
#
# Harden-Runner egress: starts at `audit`; switch to `block` with an
# allowed-endpoints allowlist once the audited traffic is stable.
#
# Secrets: none.

name: GitHub CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, type-check, and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # `[api]` is required so mypy --strict can resolve the fastapi
          # imports in `src/evidence_collector/api/app.py`. The runtime
          # API is still optional for end-users; it is only force-installed
          # in CI so the type-check has every symbol available.
          python -m pip install -e ".[dev,api]"

      - name: Ruff lint
        run: python -m ruff check src tests scripts

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: Mypy strict type-check
        run: python -m mypy src tests

      - name: Pytest with coverage gate
        run: python -m pytest --cov=evidence_collector --cov-report=xml --cov-report=term-missing

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Build package artifacts
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  sample-bundle:
    name: Produce sample evidence bundle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate sample bundle
        run: |
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id 2026.04.10 \
            --commit-sha abcdef1234567890 \
            --branch main \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir examples/sample_release/attestations \
            --output-dir output/sample_release \
            --fail-on not_ready

      - name: Export bundle JSON Schema
        run: |
          python -m evidence_collector.cli.main schema \
            --output output/sample_release/bundle.schema.json

      - name: Validate bundle against exported schema
        run: |
          python -m pip install --quiet "jsonschema>=4.20,<5"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          bundle = json.loads(Path("output/sample_release/bundle.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("output/sample_release/bundle.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(bundle), key=lambda e: e.path)
          if errors:
              for err in errors:
                  print(f"  - {list(err.path)}: {err.message}", file=sys.stderr)
              sys.exit(1)
          print("Bundle conforms to its exported JSON Schema.")
          PY

      # Structural-determinism gate. Running `run` twice against the same
      # inputs must produce a byte-identical bundle once we strip the
      # evaluation-time timestamps (`generated_at`, per-evidence
      # `collected_at`, per-control `evaluated_at`) and the `bundle_id`
      # whose suffix is derived at run time. What we are enforcing:
      #
      #   * SHA-256 integrity hashes of all collected artifacts match.
      #   * Control evaluations and gaps fire identically.
      #   * Coverage / confidence scores and release status match.
      #   * Evidence ordering, metadata, and references are byte-stable.
      #
      # If this fails, the bundle has gained a non-trivial source of
      # nondeterminism — investigate before shipping.
      - name: Determinism gate (re-run, normalize, compare SHA-256)
        run: |
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id 2026.04.10 \
            --commit-sha abcdef1234567890 \
            --branch main \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir examples/sample_release/attestations \
            --output-dir output/sample_release_rerun \
            --fail-on not_ready
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          VOLATILE_TOP = {"bundle_id", "generated_at"}
          VOLATILE_EVIDENCE = {"collected_at"}
          VOLATILE_CONTROL = {"evaluated_at"}

          def normalize(path: Path) -> bytes:
              data = json.loads(path.read_text(encoding="utf-8"))
              for key in VOLATILE_TOP:
                  data.pop(key, None)
              for ev in data.get("evidence", []):
                  for key in VOLATILE_EVIDENCE:
                      ev.pop(key, None)
              for ev in data.get("control_evaluations", []):
                  for key in VOLATILE_CONTROL:
                      ev.pop(key, None)
              return json.dumps(data, sort_keys=True, ensure_ascii=False).encode("utf-8")

          first = hashlib.sha256(normalize(Path("output/sample_release/bundle.json"))).hexdigest()
          second = hashlib.sha256(normalize(Path("output/sample_release_rerun/bundle.json"))).hexdigest()
          if first != second:
              print(f"Bundle drift detected between runs: {first} vs {second}", file=sys.stderr)
              sys.exit(1)
          print(f"Structural determinism OK · normalized sha256={first}")
          PY

      - name: Upload sample bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-release-bundle
          path: output/sample_release/
          if-no-files-found: error

  sample-bundle-windows:
    # Cross-OS determinism guard. limitations.md §8 promises that the
    # bundle is byte-stable across Linux and Windows (the file iteration
    # order is sorted before ingestion). This job re-runs the sample
    # pipeline on a Windows runner and uploads its bundle so the
    # `cross-os-determinism` job below can compare normalized SHA-256
    # against the Linux output.
    name: Produce sample evidence bundle (windows)
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate sample bundle (windows)
        shell: pwsh
        run: |
          python -m evidence_collector.cli.main run `
            --application payments-api `
            --repository acme/payments-api `
            --release-id 2026.04.10 `
            --commit-sha abcdef1234567890 `
            --branch main `
            --artifacts-dir examples/sample_release/artifacts `
            --attestations-dir examples/sample_release/attestations `
            --output-dir output/sample_release_windows `
            --fail-on not_ready

      - name: Upload windows sample bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-release-bundle-windows
          path: output/sample_release_windows/
          if-no-files-found: error

  cross-os-determinism:
    # Downloads the Linux and Windows bundles and verifies the same
    # normalize-then-SHA-256 invariant the same-runner determinism gate
    # already enforces inside `sample-bundle`. This is what
    # `docs/limitations.md §8` actually promises ("Linux and Windows
    # should produce the same bundle"); without this job the claim
    # was tested by humans, not by CI.
    name: Cross-OS determinism gate
    runs-on: ubuntu-latest
    needs:
      - sample-bundle
      - sample-bundle-windows
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download linux bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sample-release-bundle
          path: linux

      - name: Download windows bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sample-release-bundle-windows
          path: windows

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install collector (for shared normalize_bundle helper)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compare normalized SHA-256 across OSes
        # Uses the same `normalize_bundle` helper that
        # `tests/integration/test_bundle_snapshot.py` and the
        # `sdlc-evidence verify` CLI consume, so this gate cannot drift
        # from the in-repo implementation. The helper POSIX-normalizes
        # `evidence[*].raw.artifact_path` before hashing, which is the
        # only difference that legitimately varies between a Linux and
        # Windows pipeline run on the same inputs.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          from evidence_collector.application.integrity import structural_sha256

          linux = structural_sha256(Path("linux/bundle.json"))
          windows = structural_sha256(Path("windows/bundle.json"))
          if linux != windows:
              print(
                  f"Cross-OS bundle drift detected: linux={linux} windows={windows}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"Cross-OS structural determinism OK · normalized sha256={linux}")
          PY
