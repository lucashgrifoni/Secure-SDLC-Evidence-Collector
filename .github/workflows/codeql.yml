# Native CodeQL analysis
#
# `security-ci-cd.yml` already uses CodeQL transitively via Semgrep/Snyk,
# but those scanners only emit SARIF. To get CodeQL alerts indexed on
# the GitHub Security tab (Code scanning) we need a workflow that
# initializes the CodeQL database itself.
#
# Why a dedicated workflow:
#   - Code scanning UI groups alerts by tool name. Running CodeQL here
#     keeps its alerts separate from Semgrep's.
#   - The default-suite queries are tuned for "security and quality"
#     and produce far fewer false positives than the security-extended
#     suite at the cost of slightly lower recall.
#   - The schedule lets us catch advisories that were published *after*
#     a code change merged.

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 2"  # weekly, Tuesday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read  # read workflow run status (required on private repos)
    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers the landing-page assets under
        # gitpage/. This is the single CodeQL home for the repo; the security
        # pipeline (security-ci-cd.yml) intentionally does not re-run CodeQL.
        language: ["python", "javascript-typescript", "actions"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Pure Python project — no compilation step required. The
      # autobuild action exists so this workflow keeps working if a
      # native extension is ever introduced.
      - name: Autobuild
        uses: github/codeql-action/autobuild@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          category: "/language:${{ matrix.language }}"
