name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build evidence summary site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install docs extras
        run: |
          python -m pip install -e ".[docs]"

      - name: Generate evidence summary
        run: |
          mkdir -p site
          python -m evidence_collector.cli.main run \
            --application secure-sdlc-evidence-collector \
            --repository "${{ github.repository }}" \
            --release-id "${{ github.sha }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --artifacts-dir examples/self_release/artifacts \
            --attestations-dir examples/self_release/attestations \
            --output-dir site/evidence \
            --fail-on not_ready
          cp site/evidence/summary.html site/index.html
          cp README.md site/README.md
          cp CHANGELOG.md site/CHANGELOG.md

      # Build the mkdocs technical site into a `docs/` sub-path so the
      # Pages root continues to host the evidence summary HTML and the
      # technical docs are reachable at `/docs/`. Both ship from the
      # same Pages deploy.
      - name: Build mkdocs technical site
        run: |
          python -m mkdocs build --strict --site-dir site/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
