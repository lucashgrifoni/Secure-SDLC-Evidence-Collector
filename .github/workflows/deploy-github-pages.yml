# Deploy GitHub Pages — publishes the project site (Python / mkdocs).
#
# The build job stages three surfaces into a single Pages deploy:
#   /          -> gitpage/ landing page (index.html + assets)
#   /evidence/ -> CLI-generated evidence summary, bundle, and report
#   /docs/     -> mkdocs --strict technical site
#
# Repository prerequisite:
#   - Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Concurrency: serialized with cancel-in-progress=false so an in-flight
# production deploy is allowed to finish, per GitHub Pages guidance.
#
# Supply-chain hardening:
#   - All actions are pinned to immutable commit SHAs (trailing comment = tag).
#   - Keep .github/dependabot.yml enabled for github-actions to refresh pins.
#
# Secrets: none (uses the short-lived GITHUB_TOKEN via id-token: write).
#
# Landing page facts: the version, the sample verdict, the not_ready example
# and the evidence-type count on gitpage/index.html are rewritten from this
# run's CLI output, then checked; the build fails if any of them differs.
# Pull requests that touch the landing page run the build job only, so the
# check runs before merge and nothing is deployed.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "gitpage/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize Pages deployments. cancel-in-progress is false so an in-flight
  # production deployment is allowed to finish instead of being aborted by a
  # newer run, per GitHub Pages guidance. Pull request builds never deploy,
  # so they get their own group per ref and a newer push cancels an older one.
  group: pages-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build evidence summary site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Runtime + docs extra from one hash-locked file
      # (.github/requirements/docs.in), then the project with --no-deps.
      - name: Install project and docs toolchain
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install --require-hashes -r .github/requirements/docs.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Stage landing page (gitpage) at site root
        run: |
          mkdir -p site
          cp gitpage/index.html site/index.html
          cp -r gitpage/assets site/assets

      - name: Generate evidence summary
        run: |
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id "pages-demo-${{ github.sha }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir examples/sample_release/attestations \
            --output-dir site/evidence \
            --fail-on not_ready
          cp README.md site/README.md
          cp CHANGELOG.md site/CHANGELOG.md

      # The scoring example on the landing page is the sample release without
      # its rollback plan and artifact signature. It is generated here (not
      # published) so the page shows what the CLI really returns for it.
      - name: Generate landing page example (not published)
        run: |
          example_att="$RUNNER_TEMP/example-attestations"
          mkdir -p "$example_att"
          cp examples/sample_release/attestations/*.yaml "$example_att/"
          rm "$example_att/rollback_plan.yaml" "$example_att/artifact_signature.yaml"
          status=0
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id 2026.04.10 \
            --commit-sha abc1234 \
            --branch main \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir "$example_att" \
            --output-dir "$RUNNER_TEMP/example" || status=$?
          # A not_ready release exits 2; anything else but 0 is a real failure.
          # page_facts.py checks the verdict itself.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          python -m evidence_collector.cli.main schema > "$RUNNER_TEMP/schema.json"
          python -m evidence_collector.cli.main --version > "$RUNNER_TEMP/version.txt"

      - name: Inject and check landing page facts
        run: |
          facts=(--page site/index.html
                 --sample site/evidence/bundle.json
                 --example "$RUNNER_TEMP/example/bundle.json"
                 --schema "$RUNNER_TEMP/schema.json"
                 --version "$(cat "$RUNNER_TEMP/version.txt")")
          python gitpage/tools/page_facts.py inject "${facts[@]}"
          python gitpage/tools/page_facts.py check "${facts[@]}"

      # Pages layout after this job:
      #   /            -> gitpage/ landing page (index.html + assets)
      #   /evidence/   -> CLI-generated evidence summary, bundle, report
      #   /docs/       -> mkdocs technical site
      # All three ship from the same Pages deploy.
      - name: Build mkdocs technical site
        run: |
          python -m mkdocs build --strict --site-dir site/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
