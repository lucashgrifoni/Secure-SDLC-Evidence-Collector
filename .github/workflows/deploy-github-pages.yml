# Deploy GitHub Pages — publishes the project site (Python / mkdocs).
#
# The build job stages three surfaces into a single Pages deploy:
#   /          -> gitpage/ landing page (index.html + assets)
#   /evidence/ -> CLI-generated evidence summary, bundle, and report
#   /docs/     -> mkdocs --strict technical site
#
# Repository prerequisite:
#   - Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Concurrency: serialized with cancel-in-progress=false so an in-flight
# production deploy is allowed to finish, per GitHub Pages guidance.
#
# Supply-chain hardening:
#   - All actions are pinned to immutable commit SHAs (trailing comment = tag).
#   - Keep .github/dependabot.yml enabled for github-actions to refresh pins.
#
# Secrets: none (uses the short-lived GITHUB_TOKEN via id-token: write).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize Pages deployments. cancel-in-progress is false so an in-flight
  # production deployment is allowed to finish instead of being aborted by a
  # newer run, per GitHub Pages guidance.
  group: pages-${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build evidence summary site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install docs extras
        run: |
          python -m pip install -e ".[docs]"

      - name: Stage landing page (gitpage) at site root
        run: |
          mkdir -p site
          cp gitpage/index.html site/index.html
          cp -r gitpage/assets site/assets

      - name: Generate evidence summary
        run: |
          python -m evidence_collector.cli.main run \
            --application payments-api \
            --repository acme/payments-api \
            --release-id "pages-demo-${{ github.sha }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --artifacts-dir examples/sample_release/artifacts \
            --attestations-dir examples/sample_release/attestations \
            --output-dir site/evidence \
            --fail-on not_ready
          cp README.md site/README.md
          cp CHANGELOG.md site/CHANGELOG.md

      # Pages layout after this job:
      #   /            -> gitpage/ landing page (index.html + assets)
      #   /evidence/   -> CLI-generated evidence summary, bundle, report
      #   /docs/       -> mkdocs technical site
      # All three ship from the same Pages deploy.
      - name: Build mkdocs technical site
        run: |
          python -m mkdocs build --strict --site-dir site/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
