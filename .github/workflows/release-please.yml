# release-please: automate version bumps + CHANGELOG from
# conventional commits.
#
# How it works:
#   1. On every push to main, release-please scans commit messages
#      since the last release.
#   2. If it finds `feat:` / `fix:` / `BREAKING CHANGE:` commits, it
#      opens (or updates) a "release PR" containing:
#        - bumped version in pyproject.toml + src/evidence_collector/__init__.py
#        - regenerated CHANGELOG.md entry
#   3. Merging that PR triggers release-please again, which then
#      tags the commit and creates a GitHub Release stub.
#   4. The existing `publish-pypi.yml` workflow fires on the new tag and
#      runs the rest of the supply-chain pipeline (build, sign, SLSA
#      provenance, PyPI publish, container build).
#
# This file replaces ad-hoc version edits going forward. The 1.0.x
# line was hand-bumped, so the manifest is seeded with v1.0.1 to
# match.
#
# Authentication: a short-lived GitHub App installation token (minted per
# run) is used instead of the default GITHUB_TOKEN. This is required for two
# reasons:
#   1. Security — it avoids enabling the broad repo setting "Allow GitHub
#      Actions to create and approve pull requests" (which would apply to
#      every workflow). The App token is scoped to the App's permissions
#      (contents / pull-requests / issues) and expires in ~1 hour.
#   2. Cascade — tags/PRs created with the default GITHUB_TOKEN do NOT
#      trigger other workflows, so the release tag would never fire
#      publish-pypi.yml. An App token is treated as a distinct actor and
#      does trigger the downstream release pipeline.
# Setup: a GitHub App (Contents RW, Pull requests RW, Issues RW) installed on
# this repo, with its App ID and private key stored as the repository secrets
# RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_APP_PRIVATE_KEY.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: the GITHUB_TOKEN stays read-only. The write scopes
# release-please needs are carried by the GitHub App token minted below.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # write scopes are supplied by the App token, not GITHUB_TOKEN
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.1.3
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
