name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1). Required when running manually."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy strict type-check
        run: python -m mypy src tests

      - name: Pytest with coverage gate
        run: python -m pytest --cov=evidence_collector --cov-report=xml --cov-report=term-missing

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            echo "Could not resolve tag" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  release-bundle:
    name: Produce release evidence bundle
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate release bundle
        run: |
          python -m evidence_collector.cli.main run \
            --application secure-sdlc-evidence-collector \
            --repository "${{ github.repository }}" \
            --release-id "${{ needs.build.outputs.tag }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --tag "${{ needs.build.outputs.tag }}" \
            --artifacts-dir examples/self_release/artifacts \
            --attestations-dir examples/self_release/attestations \
            --output-dir release-evidence \
            --fail-on conditional

      - name: Upload release evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error

  sign-and-publish:
    name: Sign artifacts and publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, release-bundle]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign wheel, sdist, and bundle (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir -p signatures
          for f in dist/*.whl dist/*.tar.gz release-evidence/bundle.json; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            cosign sign-blob \
              --yes \
              --output-signature "signatures/${base}.sig" \
              --output-certificate "signatures/${base}.pem" \
              "$f"
          done

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum *.whl *.tar.gz > ../checksums.txt
          cd ../release-evidence && sha256sum bundle.json >> ../checksums.txt

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/bundle.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/bundle.json
            release-evidence/report.md
            release-evidence/summary.html
            signatures/*.sig
            signatures/*.pem
            checksums.txt
