name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint + format
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy src tests
      - name: Pytest
        run: pytest

  build-artifacts:
    name: Build Python wheel + sdist
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    outputs:
      wheel-name: ${{ steps.names.outputs.wheel-name }}
      sdist-name: ${{ steps.names.outputs.sdist-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist
      - name: Record artifact names
        id: names
        run: |
          wheel=$(ls dist/*.whl | head -n1)
          sdist=$(ls dist/*.tar.gz | head -n1)
          echo "wheel-name=$(basename "$wheel")" >> "$GITHUB_OUTPUT"
          echo "sdist-name=$(basename "$sdist")" >> "$GITHUB_OUTPUT"
      - name: Upload Python artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  self-bundle:
    name: Produce self-release evidence bundle
    runs-on: ubuntu-latest
    needs: build-artifacts
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate bundle for the released tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          python -m evidence_collector.cli.main run \
            --application secure-sdlc-evidence-collector \
            --repository "${{ github.repository }}" \
            --release-id "$TAG" \
            --commit-sha "${{ github.sha }}" \
            --branch main \
            --artifacts-dir examples/self_release/artifacts \
            --attestations-dir examples/self_release/attestations \
            --output-dir output/release \
            --fail-on not_ready
      - name: Upload bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-bundle
          path: output/release/
          if-no-files-found: error

  sign-and-release:
    name: Cosign keyless sign + GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts, self-bundle]
    timeout-minutes: 10
    permissions:
      contents: write # create release
      id-token: write # keyless cosign OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download Python artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-dist
          path: dist
      - name: Download release bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-bundle
          path: bundle
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Sign Python artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      - name: Sign bundle.json (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign-blob --yes bundle/bundle.json \
            --output-signature bundle/bundle.json.sig \
            --output-certificate bundle/bundle.json.pem
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NOTES_FILE=$(mktemp)
          {
            echo "## Release $TAG"
            echo
            echo "- Python wheel and sdist built from \`${{ github.sha }}\`"
            echo "- Signed keyless with cosign and Sigstore Rekor transparency log"
            echo "- Release evidence bundle attached (\`bundle.json\`, \`report.md\`, \`summary.html\`)"
            echo
            echo "See \`CHANGELOG.md\` for detailed release notes."
          } > "$NOTES_FILE"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            dist/* \
            bundle/bundle.json bundle/bundle.json.sig bundle/bundle.json.pem \
            bundle/report.md bundle/summary.html
