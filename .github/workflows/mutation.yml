# Mutation testing
#
# Mutation testing rewrites the source under test in small ways
# (replacing `>=` with `>`, deleting return statements, etc.) and
# re-runs the unit tests against each mutant. A mutant that passes the
# tests is a "survivor" — it means the test suite cannot tell the
# correct behaviour apart from the mutation, so the assertions are
# weaker than they look.
#
# Why a separate workflow:
#   - Mutation testing runs the entire focused test suite once per
#     mutation, so it is dramatically slower than a normal CI run.
#     Running it inline on every PR would push wall time past 30 min.
#   - We schedule it weekly and on workflow_dispatch so the metric is
#     visible without blocking day-to-day work.
#
# What the artifact contains:
#   - The mutmut HTML report and the raw mutation list, uploaded as a
#     workflow artifact named `mutation-report`. Drift in survivor
#     count between runs is the actionable signal.

name: Mutation testing

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: Run mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mutmut (mutate, run, collect)
        run: |
          set -euxo pipefail
          # `mutmut run` always exits non-zero when survivors exist; we
          # capture the output and let the next step decide whether to
          # fail. The threshold lives in this YAML, not in mutmut config,
          # so we can tune it without changing pyproject.toml.
          python -m mutmut run --paths-to-mutate src/evidence_collector/parsers,src/evidence_collector/scoring,src/evidence_collector/controls || true
          python -m mutmut results
          # Generate an HTML report alongside the .mutmut-cache so the
          # artifact is consumable without a local mutmut install.
          python -m mutmut html

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            html/
            .mutmut-cache
          if-no-files-found: warn
          retention-days: 30
