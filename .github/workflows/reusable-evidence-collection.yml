# Reusable GitHub Actions workflow for Secure SDLC Evidence Collector.
#
# Drop the collector into any pipeline with one ``uses:`` line:
#
# jobs:
#   evidence:
#     uses: lucashgrifoni/Secure-SDLC-Evidence-Collector/.github/workflows/reusable-evidence-collection.yml@v2.0.5
#     with:
#       application: my-app
#       repository: my-org/my-app
#       release-id: ${{ github.ref_name }}
#       artifacts-dir: scanner-output
#
# The workflow installs the collector from PyPI (pinned to the SHA of
# this calling commit), collects evidence, and uploads bundle.json +
# report.md as workflow artifacts so downstream jobs can read them.
#
# Adopters who need the AI or FedRAMP catalog pass ``catalog`` with
# the bundled-catalog name (``catalog-ai.yaml`` /
# ``catalog-ssdf-1.2.yaml`` / ``catalog-fedramp-20x-ksi.yaml``).
name: Secure SDLC Evidence Collection (reusable)

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
        description: "Logical application name (free-form, used in the bundle)."
      repository:
        type: string
        required: true
        description: "owner/repo of the project being evaluated."
      release-id:
        type: string
        required: true
        description: "Release identifier (tag, version, build number)."
      commit-sha:
        type: string
        required: false
        default: ${{ github.sha }}
        description: "Commit SHA of the release (default: current github.sha)."
      branch:
        type: string
        required: false
        default: ${{ github.ref_name }}
      artifacts-dir:
        type: string
        required: false
        default: "artifacts"
        description: "Directory containing scanner outputs (SARIF, SBOM, JUnit, etc.)."
      attestations-dir:
        type: string
        required: false
        default: ""
        description: "Optional directory with YAML/JSON attestations."
      exceptions-dir:
        type: string
        required: false
        default: ""
        description: "Optional directory with YAML/JSON exception (waiver) files."
      catalog:
        type: string
        required: false
        default: ""
        description: >-
          Optional bundled catalog name. Accepted values:
          'catalog-ai.yaml', 'catalog-ssdf-1.2.yaml',
          'catalog-fedramp-20x-ksi.yaml'. Leave empty for the default
          SSDF 1.1 catalog.
      risk-mode:
        type: string
        required: false
        default: "off"
        description: "'off' or 'epss-weighted' (T6.6)."
      profile:
        type: string
        required: false
        default: "none"
        description: "'none', 'cra-2026', or 'fedramp-20x' (T6.8)."
      collector-version:
        type: string
        required: false
        default: ""
        description: >-
          Pin the collector version (e.g. '2.0.0'). Leave empty to use
          the most recent release on PyPI. Pinning is strongly
          recommended for reproducible pipelines.
      python-version:
        type: string
        required: false
        default: "3.12"

permissions:
  contents: read

jobs:
  collect:
    name: Collect Secure SDLC evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      # Inputs and step outputs are passed via `env:` and referenced as quoted
      # shell variables, never interpolated directly into run scripts — the
      # GitHub-recommended defense against script injection
      # (CodeQL actions/code-injection) for untrusted-derived inputs.
      - name: Install secure-sdlc-evidence-collector
        env:
          COLLECTOR_VERSION: ${{ inputs.collector-version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -n "$COLLECTOR_VERSION" ]; then
            python -m pip install "secure-sdlc-evidence-collector==${COLLECTOR_VERSION}"
          else
            python -m pip install "secure-sdlc-evidence-collector"
          fi

      - name: Resolve bundled catalog path (if requested)
        id: catalog
        env:
          CATALOG: ${{ inputs.catalog }}
        run: |
          set -euo pipefail
          if [ -z "$CATALOG" ]; then
            echo "catalog_path=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          path="$(python -c "import os; from evidence_collector.controls.catalog import bundled_catalog_path; print(bundled_catalog_path(os.environ['CATALOG']))")"
          echo "catalog_path=$path" >>"$GITHUB_OUTPUT"

      - name: Run sdlc-evidence
        env:
          APPLICATION: ${{ inputs.application }}
          REPOSITORY: ${{ inputs.repository }}
          RELEASE_ID: ${{ inputs.release-id }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          BRANCH: ${{ inputs.branch }}
          ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
          RISK_MODE: ${{ inputs.risk-mode }}
          PROFILE: ${{ inputs.profile }}
          ATTESTATIONS_DIR: ${{ inputs.attestations-dir }}
          EXCEPTIONS_DIR: ${{ inputs.exceptions-dir }}
          CATALOG_PATH: ${{ steps.catalog.outputs.catalog_path }}
        run: |
          set -euo pipefail
          args=(
            --application "$APPLICATION"
            --repository "$REPOSITORY"
            --release-id "$RELEASE_ID"
            --commit-sha "$COMMIT_SHA"
            --branch "$BRANCH"
            --output-dir release-evidence
            --artifacts-dir "$ARTIFACTS_DIR"
            --risk-mode "$RISK_MODE"
            --profile "$PROFILE"
            --fail-on not_ready
          )
          if [ -n "$ATTESTATIONS_DIR" ]; then
            args+=( --attestations-dir "$ATTESTATIONS_DIR" )
          fi
          if [ -n "$EXCEPTIONS_DIR" ]; then
            args+=( --exceptions-dir "$EXCEPTIONS_DIR" )
          fi
          if [ -n "$CATALOG_PATH" ]; then
            args+=( --catalog "$CATALOG_PATH" )
          fi
          sdlc-evidence run "${args[@]}"

      - name: Upload bundle and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-sdlc-evidence
          path: release-evidence/
          if-no-files-found: error
