# Dependabot configuration for the Secure SDLC Evidence Collector (Python).
#
# Conventions applied across every ecosystem:
#   - groups   : batch minor/patch bumps into fewer reviewable PRs.
#   - cooldown : delay adopting a new release for a few days so that
#                compromised-release supply-chain attacks (usually detected
#                within a week) are caught before auto-update.
#   - ignore   : block automatic major-version jumps; majors are surfaced
#                manually rather than auto-opened.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "python"
    reviewers:
      - "lucashgrifoni"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Hash-locked CI requirements (.github/requirements/*.in -> *.txt), generated
  # by `uv pip compile --universal --generate-hashes`. Dependabot's uv ecosystem
  # only handles uv.lock, so the pip ecosystem watches these requirement files:
  # it bumps a pinned version together with its hashes. A full re-lock (new
  # transitive dependencies) uses the command in each .txt header, and the
  # `pip check` after every install fails CI if a bump leaves a lock inconsistent.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    reviewers:
      - "lucashgrifoni"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      ci-requirements:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    reviewers:
      - "lucashgrifoni"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "docker"
    reviewers:
      - "lucashgrifoni"
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
