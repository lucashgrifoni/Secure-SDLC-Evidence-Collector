[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-sdlc-evidence-collector"
version = "2.0.0"
description = "CLI-first tool to collect, normalize, evaluate and bundle Secure SDLC evidence per release."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Henrique Grifoni", email = "lucas.henriquegrifoni@gmail.com" },
]
keywords = [
    "appsec",
    "devsecops",
    "secure-sdlc",
    "ssdf",
    "evidence",
    "release-readiness",
    "sarif",
    "sbom",
    "audit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "rich>=13.7,<16.0",
    "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<3.0",
    "types-PyYAML>=6.0,<7.0",
    "types-defusedxml>=0.7,<1.0",
    "pre-commit>=3.7,<5.0",
    "hypothesis>=6.100,<7.0",
    "mutmut>=2.5,<3.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
logs = [
    "structlog>=24.1,<26.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.7,<11.0",
]

[project.scripts]
sdlc-evidence = "evidence_collector.cli.main:main"

# Plugin entry-point groups. Third parties can register custom parsers
# without forking by declaring their own entries under these groups in
# their package's `pyproject.toml`. The collector discovers them via
# `evidence_collector.plugins.discover_parsers()` /
# `discover_collectors()`. Built-in entries are listed here so the
# discovery API and the source of truth match.
[project.entry-points."evidence_collector.parsers"]
sarif = "evidence_collector.parsers:parse_sarif"
sbom = "evidence_collector.parsers:parse_sbom"
junit = "evidence_collector.parsers:parse_junit"
zap = "evidence_collector.parsers:parse_zap"
attestation = "evidence_collector.parsers:parse_attestation"
exception = "evidence_collector.parsers:parse_exception"

[project.entry-points."evidence_collector.collectors"]
local = "evidence_collector.collectors.local:LocalArtifactCollector"
github = "evidence_collector.collectors.github:GitHubCollector"
gitlab = "evidence_collector.collectors.gitlab:GitLabCollector"

[project.urls]
Homepage = "https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector"
Issues = "https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector/issues"
Changelog = "https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector/blob/main/CHANGELOG.md"
Source = "https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence_collector" = [
    "exporters/templates/*.md.j2",
    "exporters/templates/*.html.j2",
    "controls/data/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff
    "S",   # bandit
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # assert allowed in tests
    "B008",  # Typer uses function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=evidence_collector",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "unit: unit tests",
    "integration: integration tests using fixtures",
]

[tool.mutmut]
# Focus mutmut on the high-value modules. Mutation testing the entire
# tree is too slow to be practical in CI; the parsers, scoring, and
# control engine are where assertion strength matters most.
paths_to_mutate = [
    "src/evidence_collector/parsers/",
    "src/evidence_collector/scoring/",
    "src/evidence_collector/controls/",
]
runner = "python -m pytest -q --no-cov tests/unit"
backup = false

[tool.coverage.run]
branch = true
source = ["evidence_collector"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
