# pre-commit hooks
#
# Runs the same gates as CI on every commit, locally. Catches noisy
# diffs, secrets, malformed YAML and broken workflows before they reach
# a reviewer. Mirrors the gates in `.github/workflows/github-ci-cd.yml`
# and `.github/workflows/security-ci-cd.yml`.
#
# First-time setup:
#   pip install pre-commit
#   pre-commit install
#
# Run against the whole repository:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
        # Lab fixtures sometimes ship intentionally malformed JSON (e.g.
        # truncated SBOMs) to exercise tolerant-parser paths in the
        # collector. Those are evidence input, not code we own — exclude
        # the lab artifacts directory from this hook only.
        exclude: '^examples/labs/.*/artifacts/.*\.json$'
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches the lower bound of ruff>=0.6,<1.0 that pip resolves
    # in CI (currently 0.9.x). When this constraint changes in
    # pyproject.toml, bump this `rev:` to a tag that produces the same
    # `format` behavior, otherwise local and CI will disagree on
    # multi-line assert layouts.
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - types-PyYAML
          # The CLI uses typer/rich and the optional API uses fastapi.
          # Without these mypy emits "Cannot find implementation or
          # library stub" for every module that imports them, drowning
          # real type findings. Keep this list in sync with the [api]
          # extra in pyproject.toml when API deps change.
          - typer>=0.12
          - rich>=13.7
          - fastapi>=0.111
          - httpx>=0.27
          - jinja2>=3.1
          - defusedxml>=0.7
          - types-defusedxml
        # `pass_filenames: false` means pre-commit does not append matched
        # paths to the command line, so the args list must contain at
        # least one target (otherwise mypy errors with "Missing target
        # module, package, files, or command"). Pin the target to the
        # collector's source tree to match `mypy --strict src tests`
        # without the test files (which are covered by the CI job).
        args: [--config-file=pyproject.toml, src]
        pass_filenames: false
        files: ^src/

  # Secret scanning on staged content. Catches keys/tokens before they
  # land in history, complementing the Gitleaks job in security-ci-cd.yml
  # which scans the full git log on push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Shifts the actionlint job from CI to commit time so workflow typos
  # are caught before they ever hit the runner.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
