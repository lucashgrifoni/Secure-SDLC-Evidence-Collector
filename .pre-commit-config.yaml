# pre-commit hooks
#
# Runs the same gates as CI on every commit, locally. Catches noisy
# diffs, secrets, malformed YAML and broken workflows before they reach
# a reviewer. Mirrors the gates in `.github/workflows/github-ci-cd.yml`
# and `.github/workflows/security-ci-cd.yml`.
#
# First-time setup:
#   pip install pre-commit
#   pre-commit install
#
# Run against the whole repository:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - types-PyYAML
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        files: ^src/

  # Secret scanning on staged content. Catches keys/tokens before they
  # land in history, complementing the Gitleaks job in security-ci-cd.yml
  # which scans the full git log on push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Shifts the actionlint job from CI to commit time so workflow typos
  # are caught before they ever hit the runner.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
