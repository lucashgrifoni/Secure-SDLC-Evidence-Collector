# Gitleaks configuration for the Secure SDLC Evidence Collector repo.
#
# We ship recorded scanner SARIFs under examples/ and tests/fixtures/.
# Some of those upstream advisories embed example tokens (e.g.,
# `sk-live-secret123`) inside prose. Those are documentation, not
# secrets, so we allowlist the directories that hold recorded scanner
# output — but keep full-strength scanning on the collector's own
# source code.
[extend]
useDefault = true

[allowlist]
description = "Recorded third-party scanner output is prose, not secrets"
paths = [
  '''examples/labs/[^/]+/artifacts/.*''',
  '''examples/sample_release/artifacts/.*''',
  '''examples/self_release/artifacts/.*''',
  '''tests/fixtures/.*''',
  '''tests/unit/fixtures/.*''',
  '''tests/integration/fixtures/.*''',
  # Local virtual environments and Python caches. These are .gitignored,
  # so they cannot leak through commits — but `gitleaks --no-git` does
  # not honor .gitignore, and third-party packages (e.g.
  # license-expression's bundled SPDX index) ship documentation-style
  # license keys that match the default rule set. Allowlisting them
  # keeps the local pre-publication gate honest about real risk.
  '''\.venv.*/.*''',
  '''venv/.*''',
  '''env/.*''',
  '''ENV/.*''',
  '''\.mypy_cache/.*''',
  '''\.pytest_cache/.*''',
  '''\.ruff_cache/.*''',
  '''\.hypothesis/.*''',
  '''__pycache__/.*''',
]
