# Gitleaks configuration for the Secure SDLC Evidence Collector repo.
#
# We ship a small recorded scanner fixture set under examples/sample_release/
# and tests/fixtures/.
# Some of those upstream advisories embed example tokens (e.g.,
# `sk-live-secret123`) inside prose. Those are documentation, not
# secrets, so we allowlist the intentionally retained fixture directories —
# but keep full-strength scanning on the collector's own source code and on
# large generated lab/self-release outputs.
[extend]
useDefault = true

[allowlist]
description = "Recorded third-party scanner output is prose, not secrets"
paths = [
  '''examples/sample_release/artifacts/.*''',
  # Recorded scanner output for the external vulnerable-app labs. These
  # SARIF/JSON dumps embed example tokens from upstream advisories (prose,
  # not live secrets); the raw outputs are now .gitignored but remain in
  # history, so the allowlist keeps a full-history scan honest.
  '''examples/labs/.*''',
  '''tests/fixtures/.*''',
  '''tests/unit/fixtures/.*''',
  '''tests/integration/fixtures/.*''',
  # Local virtual environments and Python caches. These are .gitignored,
  # so they cannot leak through commits — but `gitleaks --no-git` does
  # not honor .gitignore, and third-party packages (e.g.
  # license-expression's bundled SPDX index) ship documentation-style
  # license keys that match the default rule set. Allowlisting them
  # keeps the local pre-publication gate honest about real risk.
  '''\.venv.*/.*''',
  '''venv/.*''',
  '''env/.*''',
  '''ENV/.*''',
  '''\.mypy_cache/.*''',
  '''\.pytest_cache/.*''',
  '''\.ruff_cache/.*''',
  '''\.hypothesis/.*''',
  '''__pycache__/.*''',
]
stopwords = [
  # A test canary written to look like a real GitHub PAT, added in a7e4044 and
  # corrected in 5df5082. It never was a credential — the value spells out that
  # it must never be logged — but Gitleaks matched `github-pat` on its shape,
  # which is exactly what a secret scanner should do. Nothing ahead of us
  # matches any more; this entry exists only because the history scan still
  # reaches the commit that carried it.
  #
  # A stopword drops a finding whose *value* contains this phrase, which is
  # narrow (no real credential contains it) and, unlike the alternatives,
  # writes nothing credential-shaped into this file. Two earlier attempts are
  # worth not repeating: a `regexes` entry has to spell the offending string
  # out, which just moved the finding here — Trivy's secret scanner does not
  # read Gitleaks' allowlist and flagged `.gitleaks.toml` itself on the next
  # run — and a `fingerprints` entry is silently ignored, because fingerprints
  # belong to `--baseline-path` and are not an allowlist key.
  "CanaryTokenMustNeverBeLogged",
]
