name: "Secure SDLC Evidence Collector"
description: >-
  Collect, normalize and evaluate Secure SDLC evidence per release, with an
  explicit release_status gate.
author: "Lucas Henrique Grifoni"
branding:
  icon: shield
  color: blue

inputs:
  application:
    description: "Application name (required)"
    required: true
  repository:
    description: "Repository reference, e.g. owner/repo (defaults to github.repository)"
    required: false
    default: ${{ github.repository }}
  release-id:
    description: "Release identifier (required)"
    required: true
  commit-sha:
    description: "Commit SHA the release is built from (defaults to github.sha)"
    required: false
    default: ${{ github.sha }}
  branch:
    description: >-
      Branch name. Defaults to the pull request's source branch, the pushed
      branch, or on a tag the repository's default branch (a tag is not a
      branch; it goes to the tag input)
    required: false
    default: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name) || github.event.repository.default_branch || github.ref_name }}
  tag:
    description: "Git tag recorded for the release (defaults to the pushed tag, empty otherwise)"
    required: false
    default: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  pipeline-run-id:
    description: "Pipeline run recorded for the release (defaults to github.run_id); empty to omit"
    required: false
    default: ${{ github.run_id }}
  build-id:
    description: "Build recorded for the release (defaults to run id and attempt); empty to omit"
    required: false
    default: ${{ github.run_id }}-${{ github.run_attempt }}
  environment:
    description: "Target environment"
    required: false
    default: "production"
  artifacts-dir:
    description: >-
      Directory containing raw evidence artifacts (SARIF, SBOM, JUnit). Skipped
      with a notice (default value) or a warning (any other value) when it does
      not exist
    required: false
    default: "artifacts"
  attestations-dir:
    description: >-
      Directory containing YAML/JSON attestations. Skipped with a notice
      (default value) or a warning (any other value) when it does not exist
    required: false
    default: "attestations"
  pull-request:
    description: "GitHub PR number to attach code-review evidence from"
    required: false
    default: ""
  workflow-run:
    description: >-
      GitHub Actions run ID to attach workflow evidence from. Only a run that
      concluded with success satisfies a control; the run executing this
      action is still in progress, so its own run ID never does
    required: false
    default: ""
  catalog:
    description: >-
      Control catalog: a path to your own YAML, or the bare name of a bundled
      catalog (catalog.yaml, catalog-ssdf-1.2.yaml, catalog-ai.yaml,
      catalog-fedramp-cr26.yaml, catalog-osps-baseline.yaml, or the deprecated
      catalog-fedramp-20x-ksi.yaml)
    required: false
    default: ""
  exceptions-dir:
    description: "Directory with YAML/JSON waiver (exception) files"
    required: false
    default: ""
  artifact-root:
    description: >-
      Base directory that absolute artifact paths are rewritten against, so the
      bundle records repo-relative paths instead of the runner's filesystem
      layout. Defaults to the workspace; set to "" to disable.
    required: false
    default: ${{ github.workspace }}
  profile:
    description: "Regulatory profile: none | cra-2026 | fedramp-20x"
    required: false
    default: "none"
  cra-context:
    description: "Release-bound CRA operator context JSON; requires profile cra-2026"
    required: false
    default: ""
  fedramp-class:
    description: "CR26 class A, B, C or D, recorded as metadata only; requires profile fedramp-20x"
    required: false
    default: ""
  risk-mode:
    description: >-
      Verdict mode: off (presence-based, preserves byte-stability) or
      epss-weighted. This Action does not run enrich, so freshly collected
      evidence carries no EPSS / KEV data and the verdict and exit code stay
      presence-based; the mode is recorded in the bundle and applied when
      sdlc-evidence enrich is run on it in a later step
    required: false
    default: "off"
  epss-percentile-threshold:
    description: "Under risk-mode epss-weighted, EPSS percentile treated as exploitable"
    required: false
    default: ""
  output-dir:
    description: "Where to write bundle.json, report.md, summary.html"
    required: false
    default: "output/sdlc-evidence"
  fail-on:
    description: >-
      Verdict from which the step fails: not_ready (default; a conditional
      release passes) or conditional. 'ready' behaves like conditional. 'none'
      is observe mode: the verdict is reported and the step passes, unless the
      collector could not run at all (exit 3)
    required: false
    default: "not_ready"
  python-version:
    description: "Python version used to run the collector"
    required: false
    default: "3.12"
  version:
    description: >-
      Collector to install instead of this action's own copy: a git ref of this
      repository. A plain release number such as 4.2.0 is read as the tag v4.2.0
    required: false
    default: ""

outputs:
  bundle-path:
    description: "Absolute path of the generated bundle.json"
    value: ${{ steps.collect.outputs.bundle-path }}
  release-status:
    description: "Final release_status computed by the collector"
    value: ${{ steps.collect.outputs.release-status }}
  coverage-score:
    description: "Evidence coverage score (0-100)"
    value: ${{ steps.collect.outputs.coverage-score }}
  report-path:
    description: "Absolute path of the generated report.md"
    value: ${{ steps.collect.outputs.report-path }}
  controls-total:
    description: "Number of controls in the catalog the bundle was evaluated against"
    value: ${{ steps.collect.outputs.controls-total }}
  controls-met:
    description: "Controls fully satisfied by the evidence"
    value: ${{ steps.collect.outputs.controls-met }}
  controls-partial:
    description: "Controls only partly satisfied"
    value: ${{ steps.collect.outputs.controls-partial }}
  controls-missing:
    description: "Controls with no satisfying evidence"
    value: ${{ steps.collect.outputs.controls-missing }}
  controls-waived:
    description: "Controls covered by an approved waiver"
    value: ${{ steps.collect.outputs.controls-waived }}
  controls-not-applicable:
    description: "Controls that do not apply to this release"
    value: ${{ steps.collect.outputs.controls-not-applicable }}
  collection-errors:
    description: "Number of supplied inputs that could not be ingested (bundle collection_errors)"
    value: ${{ steps.collect.outputs.collection-errors }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    # All workflow inputs and ${{ github.* }} context are passed through `env:`
    # and referenced as quoted shell variables, never interpolated directly
    # into the run script. This is the GitHub-recommended defense against
    # script injection (CodeQL actions/code-injection) when a caller wires an
    # input from untrusted data (issue titles, branch names, etc.).
    #
    # Every interpreter call uses `python -P`: the working directory is the
    # caller's checkout, and without -P a module planted there (json.py,
    # typer.py, an evidence_collector/ package) is imported ahead of the real
    # one and runs inside these steps.
    - name: Install collector
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          # The other surfaces take a release number (4.2.0); the tags are v4.2.0.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="v${VERSION}"
          fi
          python -P -m pip install --upgrade "git+https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector@${VERSION}"
        elif [ -f "${ACTION_PATH}/pyproject.toml" ]; then
          # Third-party code comes from the hash locks shipped with this
          # action, then the collector itself with --no-deps, as in CI. The
          # locks are tested on Python 3.12 and 3.13 (action-self-test); other
          # versions resolve the dependency ranges in pyproject.toml.
          locks="${ACTION_PATH}/.github/requirements"
          if python -P -c 'import sys; sys.exit(sys.version_info[:2] not in ((3, 12), (3, 13)))'; then
            python -P -m pip install --require-hashes -r "${locks}/pip.txt"
            python -P -m pip install --require-hashes -r "${locks}/runtime.txt"
            python -P -m pip install --no-deps "${ACTION_PATH}"
          else
            echo "::notice title=Dependencies not hash-locked::The dependency locks cover Python 3.12 and 3.13; installing the version ranges from pyproject.toml instead."
            python -P -m pip install "${ACTION_PATH}"
          fi
        else
          python -P -m pip install --upgrade "git+https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector"
        fi

    - name: Run Secure SDLC Evidence Collector
      id: collect
      shell: bash
      env:
        # Only --pull-request and --workflow-run call the GitHub API. Without
        # them the token stays out of the step, and an inherited GITHUB_TOKEN
        # is blanked rather than handed to the collector process.
        GITHUB_TOKEN: ${{ (inputs.pull-request != '' || inputs.workflow-run != '') && github.token || '' }}
        APPLICATION: ${{ inputs.application }}
        REPOSITORY: ${{ inputs.repository }}
        RELEASE_ID: ${{ inputs.release-id }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        BRANCH: ${{ inputs.branch }}
        TAG: ${{ inputs.tag }}
        PIPELINE_RUN_ID: ${{ inputs.pipeline-run-id }}
        BUILD_ID: ${{ inputs.build-id }}
        ENVIRONMENT: ${{ inputs.environment }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FAIL_ON: ${{ inputs.fail-on }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        WORKFLOW_RUN: ${{ inputs.workflow-run }}
        CATALOG: ${{ inputs.catalog }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        ATTESTATIONS_DIR: ${{ inputs.attestations-dir }}
        EXCEPTIONS_DIR: ${{ inputs.exceptions-dir }}
        ARTIFACT_ROOT: ${{ inputs.artifact-root }}
        PROFILE: ${{ inputs.profile }}
        CRA_CONTEXT: ${{ inputs.cra-context }}
        FEDRAMP_CLASS: ${{ inputs.fedramp-class }}
        RISK_MODE: ${{ inputs.risk-mode }}
        EPSS_PERCENTILE_THRESHOLD: ${{ inputs.epss-percentile-threshold }}
      run: |
        set -euo pipefail

        # Workflow commands end at the line break, so text taken from inputs
        # is escaped the way @actions/core escapes a message.
        annotate() {
          local message="$3"
          message="${message//%/%25}"
          message="${message//$'\r'/%0D}"
          message="${message//$'\n'/%0A}"
          echo "::$1 title=$2::${message}"
        }
        # A missing evidence directory is still skipped, as before, but no
        # longer silently: a typo in the path is named in the log.
        report_skipped_dir() {
          local level=warning
          if [ "$2" = "$3" ]; then
            level=notice
          fi
          annotate "$level" "$1 not found" "$1 '$2' does not exist, so nothing was collected from it."
        }

        # Observe mode: with `fail-on: none` the collector runs with the
        # default threshold and the verdict exits (1, 2) become 0 below. Exit 3,
        # the collector could not run, still fails the step.
        fail_on="$FAIL_ON"
        observe=""
        if [ "$(printf '%s' "$FAIL_ON" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
          observe=1
          fail_on="not_ready"
        fi

        extra_args=()
        if [ -n "$PULL_REQUEST" ]; then
          extra_args+=(--pull-request "$PULL_REQUEST")
        fi
        if [ -n "$WORKFLOW_RUN" ]; then
          extra_args+=(--workflow-run "$WORKFLOW_RUN")
        fi
        if [ -n "$CATALOG" ]; then
          extra_args+=(--catalog "$CATALOG")
        fi
        if [ -n "$TAG" ]; then
          extra_args+=(--tag "$TAG")
        fi
        if [ -n "$PIPELINE_RUN_ID" ]; then
          extra_args+=(--pipeline-run-id "$PIPELINE_RUN_ID")
        fi
        if [ -n "$BUILD_ID" ]; then
          extra_args+=(--build-id "$BUILD_ID")
        fi
        if [ -d "$ARTIFACTS_DIR" ]; then
          extra_args+=(--artifacts-dir "$ARTIFACTS_DIR")
        elif [ -n "$ARTIFACTS_DIR" ]; then
          report_skipped_dir artifacts-dir "$ARTIFACTS_DIR" artifacts
        fi
        if [ -d "$ATTESTATIONS_DIR" ]; then
          extra_args+=(--attestations-dir "$ATTESTATIONS_DIR")
        elif [ -n "$ATTESTATIONS_DIR" ]; then
          report_skipped_dir attestations-dir "$ATTESTATIONS_DIR" attestations
        fi
        # A waiver directory that was configured but is not there is a real
        # problem — the release would silently lose an approved, time-bound
        # exception — so it is passed through and the collector reports it,
        # rather than being skipped like the optional evidence directories.
        if [ -n "$EXCEPTIONS_DIR" ]; then
          extra_args+=(--exceptions-dir "$EXCEPTIONS_DIR")
        fi
        if [ -n "$ARTIFACT_ROOT" ]; then
          extra_args+=(--artifact-root "$ARTIFACT_ROOT")
        fi
        if [ -n "$PROFILE" ] && [ "$PROFILE" != "none" ]; then
          extra_args+=(--profile "$PROFILE")
        fi
        if [ -n "$CRA_CONTEXT" ]; then
          extra_args+=(--cra-context "$CRA_CONTEXT")
        fi
        if [ -n "$FEDRAMP_CLASS" ]; then
          extra_args+=(--fedramp-class "$FEDRAMP_CLASS")
        fi
        if [ -n "$RISK_MODE" ] && [ "$RISK_MODE" != "off" ]; then
          extra_args+=(--risk-mode "$RISK_MODE")
        fi
        if [ -n "$EPSS_PERCENTILE_THRESHOLD" ]; then
          extra_args+=(--epss-percentile-threshold "$EPSS_PERCENTILE_THRESHOLD")
        fi

        # A bundle already in the output directory (an earlier step, a reused
        # self-hosted runner) must not pass for this run's verdict when the CLI
        # fails before writing one. The CLI writes the bundle before any
        # --fail-on exit, so a bundle newer than this marker is this run's.
        started="$(mktemp)"
        python -P -m evidence_collector.cli.main run \
          --application "$APPLICATION" \
          --repository "$REPOSITORY" \
          --release-id "$RELEASE_ID" \
          --commit-sha "$COMMIT_SHA" \
          --branch "$BRANCH" \
          --environment "$ENVIRONMENT" \
          --output-dir "$OUTPUT_DIR" \
          --fail-on "$fail_on" \
          "${extra_args[@]}" || exit_code=$?

        bundle="${OUTPUT_DIR}/bundle.json"
        if [ -f "$bundle" ] && [ "$bundle" -nt "$started" ]; then
          BUNDLE_FILE="$bundle" python -P - <<'PY' >>"$GITHUB_OUTPUT"
        import json, os
        bundle = os.environ["BUNDLE_FILE"]
        with open(bundle, encoding="utf-8") as fh:
            data = json.load(fh)
        summary = data["summary"]
        errors = data.get("collection_errors") or []
        print(f"bundle-path={os.path.abspath(bundle)}")
        print(f"release-status={summary['release_status']}")
        print(f"coverage-score={summary['evidence_coverage_score']}")
        report = os.path.join(os.path.dirname(os.path.abspath(bundle)), "report.md")
        print(f"report-path={report}")
        print(f"controls-total={summary['total_controls']}")
        print(f"controls-met={summary['controls_met']}")
        print(f"controls-partial={summary['controls_partial']}")
        print(f"controls-missing={summary['controls_missing']}")
        print(f"controls-waived={summary['controls_waived']}")
        print(f"controls-not-applicable={summary['controls_not_applicable']}")
        print(f"collection-errors={len(errors)}")


        def code(value):
            # Text that came from the caller's inputs is shown as a code span
            # that cannot close itself or start a new Markdown line.
            text = " ".join(str(value).replace("`", "'").split())
            return f"`{text}`"


        def listed(items):
            return ", ".join(code(item) for item in items) if items else "none"


        step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if step_summary:
            # A missing critical control makes the release not_ready, a
            # missing high one conditional; the summary keeps them apart.
            criticality = {
                evaluation["control_id"]: evaluation["criticality"]
                for evaluation in data.get("control_evaluations") or []
            }
            missing = summary.get("missing_critical_evidence") or []
            critical = [m for m in missing if criticality.get(m.split(":", 1)[0]) == "critical"]
            high = [m for m in missing if m not in critical]
            lines = [
                "### Secure SDLC Evidence Collector",
                "",
                f"{code(data['application']['name'])} release {code(data['release']['release_id'])}",
                "",
                "| Release status | Coverage | Met | Partial | Missing | Waived | Not applicable | Total |",
                "|---|---|---|---|---|---|---|---|",
                f"| {code(summary['release_status'])} | {summary['evidence_coverage_score']} "
                f"| {summary['controls_met']} | {summary['controls_partial']} "
                f"| {summary['controls_missing']} | {summary['controls_waived']} "
                f"| {summary['controls_not_applicable']} | {summary['total_controls']} |",
                "",
                f"Missing critical evidence (not_ready): {listed(critical)}",
                "",
                f"Missing high evidence (conditional): {listed(high)}",
                "",
            ]
            if errors:
                lines += [f"Collection warnings, inputs that could not be read ({len(errors)}):", ""]
                lines += [
                    f"- {code(error.get('path', ''))}: {code(error.get('reason', ''))}"
                    for error in errors[:10]
                ]
                if len(errors) > 10:
                    lines.append(f"- {len(errors) - 10} more in the report")
                lines.append("")
            shown = os.path.join(os.path.dirname(bundle), "report.md")
            lines += [
                f"Full report: {code(shown)}. Upload the output directory with "
                "actions/upload-artifact to keep it after the job.",
                "",
            ]
            with open(step_summary, "a", encoding="utf-8") as fh:
                fh.write("\n".join(lines) + "\n")
        PY
        fi
        rm -f "$started"

        if [ -n "$observe" ] && { [ "${exit_code:-0}" = 1 ] || [ "${exit_code:-0}" = 2 ]; }; then
          annotate notice "Observe mode" "fail-on is none, so the release status did not fail the step (the collector exited ${exit_code})."
          exit_code=0
        fi
        exit "${exit_code:-0}"
