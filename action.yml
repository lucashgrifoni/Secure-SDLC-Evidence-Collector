name: "Secure SDLC Evidence Collector"
description: >-
  Collect, normalize and evaluate Secure SDLC evidence per release and
  produce bundle.json, report.md, and summary.html with an explicit
  release_status gate.
author: "Lucas Henrique Grifoni"
branding:
  icon: shield
  color: blue

inputs:
  application:
    description: "Application name (required)"
    required: true
  repository:
    description: "Repository reference, e.g. owner/repo (defaults to github.repository)"
    required: false
    default: ${{ github.repository }}
  release-id:
    description: "Release identifier (required)"
    required: true
  commit-sha:
    description: "Commit SHA the release is built from (defaults to github.sha)"
    required: false
    default: ${{ github.sha }}
  branch:
    description: "Branch name (defaults to github.ref_name)"
    required: false
    default: ${{ github.ref_name }}
  environment:
    description: "Target environment"
    required: false
    default: "production"
  artifacts-dir:
    description: "Directory containing raw evidence artifacts (SARIF, SBOM, JUnit)"
    required: false
    default: "artifacts"
  attestations-dir:
    description: "Directory containing YAML/JSON attestations"
    required: false
    default: "attestations"
  pull-request:
    description: "GitHub PR number to attach code-review evidence from"
    required: false
    default: ""
  workflow-run:
    description: "GitHub Actions run ID to attach workflow evidence from"
    required: false
    default: ""
  catalog:
    description: >-
      Control catalog: a path to your own YAML, or the bare name of a bundled
      catalog (catalog.yaml, catalog-ssdf-1.2.yaml, catalog-ai.yaml,
      catalog-fedramp-20x-ksi.yaml, catalog-osps-baseline.yaml)
    required: false
    default: ""
  exceptions-dir:
    description: "Directory with YAML/JSON waiver (exception) files"
    required: false
    default: ""
  artifact-root:
    description: >-
      Base directory that absolute artifact paths are rewritten against, so the
      bundle records repo-relative paths instead of the runner's filesystem
      layout. Defaults to the workspace; set to "" to disable.
    required: false
    default: ${{ github.workspace }}
  profile:
    description: "Regulatory profile: none | cra-2026 | fedramp-20x"
    required: false
    default: "none"
  risk-mode:
    description: >-
      Verdict mode: off (presence-based, preserves byte-stability) or
      epss-weighted (re-derives release_status from EPSS + KEV data already
      present in the bundle)
    required: false
    default: "off"
  epss-percentile-threshold:
    description: "Under risk-mode epss-weighted, EPSS percentile treated as exploitable"
    required: false
    default: ""
  output-dir:
    description: "Where to write bundle.json, report.md, summary.html"
    required: false
    default: "output/sdlc-evidence"
  fail-on:
    description: "Exit non-zero when release_status reaches: ready|conditional|not_ready"
    required: false
    default: "not_ready"
  python-version:
    description: "Python version used to run the collector"
    required: false
    default: "3.12"
  version:
    description: "Version of the collector to install (git ref on this repo)"
    required: false
    default: ""

outputs:
  bundle-path:
    description: "Absolute path of the generated bundle.json"
    value: ${{ steps.collect.outputs.bundle-path }}
  release-status:
    description: "Final release_status computed by the collector"
    value: ${{ steps.collect.outputs.release-status }}
  coverage-score:
    description: "Evidence coverage score (0-100)"
    value: ${{ steps.collect.outputs.coverage-score }}
  report-path:
    description: "Absolute path of the generated report.md"
    value: ${{ steps.collect.outputs.report-path }}
  controls-total:
    description: "Number of controls in the catalog the bundle was evaluated against"
    value: ${{ steps.collect.outputs.controls-total }}
  controls-met:
    description: "Controls fully satisfied by the evidence"
    value: ${{ steps.collect.outputs.controls-met }}
  controls-partial:
    description: "Controls only partly satisfied"
    value: ${{ steps.collect.outputs.controls-partial }}
  controls-missing:
    description: "Controls with no satisfying evidence"
    value: ${{ steps.collect.outputs.controls-missing }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    # All workflow inputs and ${{ github.* }} context are passed through `env:`
    # and referenced as quoted shell variables, never interpolated directly
    # into the run script. This is the GitHub-recommended defense against
    # script injection (CodeQL actions/code-injection) when a caller wires an
    # input from untrusted data (issue titles, branch names, etc.).
    - name: Install collector
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          python -m pip install --upgrade "git+https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector@${VERSION}"
        elif [ -f "${ACTION_PATH}/pyproject.toml" ]; then
          python -m pip install "${ACTION_PATH}"
        else
          python -m pip install --upgrade "git+https://github.com/lucashgrifoni/Secure-SDLC-Evidence-Collector"
        fi

    - name: Run Secure SDLC Evidence Collector
      id: collect
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        APPLICATION: ${{ inputs.application }}
        REPOSITORY: ${{ inputs.repository }}
        RELEASE_ID: ${{ inputs.release-id }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        BRANCH: ${{ inputs.branch }}
        ENVIRONMENT: ${{ inputs.environment }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FAIL_ON: ${{ inputs.fail-on }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        WORKFLOW_RUN: ${{ inputs.workflow-run }}
        CATALOG: ${{ inputs.catalog }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        ATTESTATIONS_DIR: ${{ inputs.attestations-dir }}
        EXCEPTIONS_DIR: ${{ inputs.exceptions-dir }}
        ARTIFACT_ROOT: ${{ inputs.artifact-root }}
        PROFILE: ${{ inputs.profile }}
        RISK_MODE: ${{ inputs.risk-mode }}
        EPSS_PERCENTILE_THRESHOLD: ${{ inputs.epss-percentile-threshold }}
      run: |
        set -euo pipefail
        extra_args=()
        if [ -n "$PULL_REQUEST" ]; then
          extra_args+=(--pull-request "$PULL_REQUEST")
        fi
        if [ -n "$WORKFLOW_RUN" ]; then
          extra_args+=(--workflow-run "$WORKFLOW_RUN")
        fi
        if [ -n "$CATALOG" ]; then
          extra_args+=(--catalog "$CATALOG")
        fi
        if [ -d "$ARTIFACTS_DIR" ]; then
          extra_args+=(--artifacts-dir "$ARTIFACTS_DIR")
        fi
        if [ -d "$ATTESTATIONS_DIR" ]; then
          extra_args+=(--attestations-dir "$ATTESTATIONS_DIR")
        fi
        # A waiver directory that was configured but is not there is a real
        # problem — the release would silently lose an approved, time-bound
        # exception — so it is passed through and the collector reports it,
        # rather than being skipped like the optional evidence directories.
        if [ -n "$EXCEPTIONS_DIR" ]; then
          extra_args+=(--exceptions-dir "$EXCEPTIONS_DIR")
        fi
        if [ -n "$ARTIFACT_ROOT" ]; then
          extra_args+=(--artifact-root "$ARTIFACT_ROOT")
        fi
        if [ -n "$PROFILE" ] && [ "$PROFILE" != "none" ]; then
          extra_args+=(--profile "$PROFILE")
        fi
        if [ -n "$RISK_MODE" ] && [ "$RISK_MODE" != "off" ]; then
          extra_args+=(--risk-mode "$RISK_MODE")
        fi
        if [ -n "$EPSS_PERCENTILE_THRESHOLD" ]; then
          extra_args+=(--epss-percentile-threshold "$EPSS_PERCENTILE_THRESHOLD")
        fi

        # A bundle already in the output directory (an earlier step, a reused
        # self-hosted runner) must not pass for this run's verdict when the CLI
        # fails before writing one. The CLI writes the bundle before any
        # --fail-on exit, so a bundle newer than this marker is this run's.
        started="$(mktemp)"
        python -m evidence_collector.cli.main run \
          --application "$APPLICATION" \
          --repository "$REPOSITORY" \
          --release-id "$RELEASE_ID" \
          --commit-sha "$COMMIT_SHA" \
          --branch "$BRANCH" \
          --environment "$ENVIRONMENT" \
          --output-dir "$OUTPUT_DIR" \
          --fail-on "$FAIL_ON" \
          "${extra_args[@]}" || exit_code=$?

        bundle="${OUTPUT_DIR}/bundle.json"
        if [ -f "$bundle" ] && [ "$bundle" -nt "$started" ]; then
          BUNDLE_FILE="$bundle" python - <<'PY' >>"$GITHUB_OUTPUT"
        import json, os
        bundle = os.environ["BUNDLE_FILE"]
        with open(bundle, encoding="utf-8") as fh:
            data = json.load(fh)
        summary = data["summary"]
        print(f"bundle-path={os.path.abspath(bundle)}")
        print(f"release-status={summary['release_status']}")
        print(f"coverage-score={summary['evidence_coverage_score']}")
        report = os.path.join(os.path.dirname(os.path.abspath(bundle)), "report.md")
        print(f"report-path={report}")
        print(f"controls-total={summary['total_controls']}")
        print(f"controls-met={summary['controls_met']}")
        print(f"controls-partial={summary['controls_partial']}")
        print(f"controls-missing={summary['controls_missing']}")


        def code(value):
            # Text that came from the caller's inputs is shown as a code span
            # that cannot close itself or start a new Markdown line.
            text = " ".join(str(value).replace("`", "'").split())
            return f"`{text}`"


        step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if step_summary:
            missing = summary.get("missing_critical_evidence") or []
            lines = [
                "### Secure SDLC Evidence Collector",
                "",
                f"{code(data['application']['name'])} release {code(data['release']['release_id'])}",
                "",
                "| Release status | Coverage | Met | Partial | Missing | Waived | Total |",
                "|---|---|---|---|---|---|---|",
                f"| {code(summary['release_status'])} | {summary['evidence_coverage_score']} "
                f"| {summary['controls_met']} | {summary['controls_partial']} "
                f"| {summary['controls_missing']} | {summary['controls_waived']} "
                f"| {summary['total_controls']} |",
                "",
                "Missing critical evidence: "
                + (", ".join(code(item) for item in missing) if missing else "none"),
                "",
            ]
            with open(step_summary, "a", encoding="utf-8") as fh:
                fh.write("\n".join(lines) + "\n")
        PY
        fi
        rm -f "$started"

        exit "${exit_code:-0}"
